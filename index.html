<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Asystent PL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    width: 100%; max-width: 600px; height: 100%; max-height: 600px;
    margin: 0 auto; display: flex; flex-direction: column;
    padding: 20px 24px 24px;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.18);
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #4da3ff; box-shadow: 0 0 12px #4da3ff; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: .5px; }
  .sub { font-size: 17px; color: rgba(255,255,255,.6); margin-top: 2px; }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 4px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 88%; padding: 12px 16px; border-radius: 18px;
    font-size: 21px; line-height: 1.35;
  }
  .msg.bot { background: rgba(255,255,255,.1); align-self: flex-start; }
  .msg.user { background: #2b6cb0; align-self: flex-end; }
  #quick { display: flex; gap: 10px; padding: 10px 0 14px; flex-wrap: wrap; }
  button, input {
    font-family: inherit; color: #fff;
  }
  .chip {
    background: rgba(255,255,255,.08); border: 2px solid transparent;
    border-radius: 999px; padding: 10px 18px; font-size: 19px; cursor: pointer;
  }
  #inputRow { display: flex; gap: 10px; }
  #textInput {
    flex: 1; background: rgba(255,255,255,.08); border: 2px solid transparent;
    border-radius: 14px; padding: 14px 16px; font-size: 20px; outline: none;
  }
  #sendBtn {
    background: #2b6cb0; border: 2px solid transparent; border-radius: 14px;
    padding: 0 26px; font-size: 20px; font-weight: 600; cursor: pointer;
  }
  /* Tryb telefonu (?mode=phone): prosty formularz wysyłania pytań na okulary */
  #phoneWrap { display: flex; flex-direction: column; gap: 14px; padding-top: 18px; }
  #phoneInput {
    font-size: 22px; padding: 16px; border-radius: 14px;
    border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
    color: #fff; font-family: inherit; resize: vertical;
  }
  #phoneSend {
    background: #2b6cb0; border: none; border-radius: 14px;
    padding: 18px; font-size: 22px; font-weight: 700; color: #fff; cursor: pointer;
  }
  #phoneStatus { font-size: 18px; color: rgba(255,255,255,.75); min-height: 28px; text-align: center; }
  /* D-pad focus: wyraźny, widoczny pierścień */
  .focusable:focus, .focusable.focused {
    outline: none; border-color: #4da3ff !important;
    box-shadow: 0 0 0 3px rgba(77,163,255,.55);
  }
  .hint { font-size: 15px; color: rgba(255,255,255,.45); text-align: center; padding-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <div>
      <h1>Asystent PL</h1>
      <div class="sub">Polski asystent na okulary</div>
    </div>
  </header>

  <div id="messages" aria-live="polite"></div>

  <div id="quick">
    <button class="chip focusable" data-q="Która godzina?">Która godzina?</button>
    <button class="chip focusable" data-q="Jaka będzie pogoda?">Pogoda</button>
    <button class="chip focusable" data-q="Opowiedz żart">Żart</button>
    <button class="chip focusable" data-q="Pomoc">Pomoc</button>
  </div>

  <div id="inputRow">
    <input id="textInput" class="focusable" type="text" placeholder="Napisz pytanie…" autocomplete="off">
    <button id="sendBtn" class="focusable">Wyślij</button>
  </div>
  <div class="hint">D-pad: strzałki = nawigacja, Enter = wybierz</div>
</div>

<script>
"use strict";
/* ============================================================
   Asystent PL — prototyp web aplikacji na Meta Ray-Ban Display
   BACKEND_URL: serwer AI (POST {message} -> {reply}).
   Domyślnie "/api/chat" — ten sam serwer, który serwuje tę stronę
   (backend/server.js). Pusty "" = czysty tryb demo (bez AI).
   Jeśli serwer nie odpowiada, aplikacja sama wraca do trybu demo.
   Pogoda działa zawsze na żywo przez darmowe Open-Meteo.
   ============================================================ */
const BACKEND_URL = "/api/chat"; // albo "https://twoj-serwer.pl/api/chat", albo ""

/* Tryb telefonu: ten sam adres z ?mode=phone pokazuje prosty formularz
   do wysyłania pytań na okulary (telefon robi za mikrofon/klawiaturę,
   bo okulary rozpoznają tylko angielski głos). */
const PHONE_MODE = new URLSearchParams(location.search).get("mode") === "phone";

if (PHONE_MODE) { initPhoneMode(); } else { initGlassesMode(); }

function initPhoneMode() {
  document.title = "Asystent PL — telefon";
  document.getElementById("app").innerHTML =
    '<header><div class="dot"></div><div><h1>Asystent PL</h1>' +
    '<div class="sub">Wprowadzanie z telefonu</div></div></header>' +
    '<div id="phoneWrap">' +
    '<textarea id="phoneInput" rows="4" placeholder="Napisz lub podyktuj pytanie po polsku…"></textarea>' +
    '<button id="phoneSend">Wyślij na okulary</button>' +
    '<div id="phoneStatus" aria-live="polite"></div>' +
    '<div class="hint">Wskazówka: mikrofon na klawiaturze iPhone dyktuje po polsku.</div>' +
    "</div>";
  const input = document.getElementById("phoneInput");
  const status = document.getElementById("phoneStatus");
  document.getElementById("phoneSend").addEventListener("click", async () => {
    const q = input.value.trim();
    if (!q) return;
    status.textContent = "Wysyłanie…";
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: q})
      });
      if (!res.ok) throw new Error("http " + res.status);
      status.textContent = "Wysłano ✓ Odpowiedź pojawi się na okularach.";
      input.value = "";
    } catch (e) {
      status.textContent = "Błąd wysyłania. Sprawdź połączenie i spróbuj ponownie.";
    }
  });
}

function initGlassesMode() {
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("textInput");

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* --- Pogoda: darmowe API Open-Meteo (bez klucza), CORS włączone --- */
const WMO_PL = {
  0: "bezchmurne niebo", 1: "przeważnie pogodnie", 2: "częściowe zachmurzenie",
  3: "pochmurno", 45: "mgła", 48: "marznąca mgła",
  51: "lekka mżawka", 53: "mżawka", 55: "gęsta mżawka",
  56: "marznąca mżawka", 57: "marznąca mżawka",
  61: "słaby deszcz", 63: "deszcz", 65: "ulewny deszcz",
  66: "marznący deszcz", 67: "marznący deszcz",
  71: "słaby śnieg", 73: "śnieg", 75: "intensywny śnieg", 77: "ziarna śniegu",
  80: "słabe przelotne opady", 81: "przelotne opady", 82: "gwałtowne przelotne opady",
  85: "przelotny śnieg", 86: "przelotny śnieg",
  95: "burza", 96: "burza z gradem", 99: "burza z gradem"
};
const FALLBACK_POS = { lat: 52.2297, lon: 21.0122, name: "Warszawie" }; // Warszawa

function getPosition() {
  return new Promise((resolve) => {
    if (!("geolocation" in navigator)) return resolve(FALLBACK_POS);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, name: "Twojej okolicy" }),
      () => resolve(FALLBACK_POS),
      { timeout: 4000, maximumAge: 600000 }
    );
  });
}

async function liveWeather() {
  try {
    const pos = await getPosition();
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + pos.lat.toFixed(4) +
      "&longitude=" + pos.lon.toFixed(4) +
      "&current=temperature_2m,weathercode&timezone=auto";
    const res = await fetch(url);
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    const t = Math.round(data.current.temperature_2m);
    const desc = WMO_PL[data.current.weathercode] || "zmienne warunki";
    return "W " + pos.name + ": " + t + "°C, " + desc + ".";
  } catch (e) {
    return "Nie udało się pobrać pogody. Sprawdź połączenie z internetem.";
  }
}
function localBrain(q) {
  const t = q.toLowerCase();
  if (/(godzina|czas|która)/.test(t)) {
    const d = new Date();
    return "Jest godzina " + d.toLocaleTimeString("pl-PL", {hour: "2-digit", minute: "2-digit"}) + ".";
  }
  if (/(pogoda|pogodę)/.test(t)) {
    return "__WEATHER__";
  }
  if (/(żart|dowcip|śmieszne)/.test(t)) {
    const jokes = [
      "Dlaczego programiści mylą Halloween z Bożym Narodzeniem? Bo OCT 31 == DEC 25.",
      "Przychodzi baba do lekarza, a lekarz też baba. I poszły na kawę.",
      "Co mówi zero do ósemki? Fajny pasek!"
    ];
    return jokes[Math.floor(Math.random() * jokes.length)];
  }
  if (/(pomoc|help|co umiesz)/.test(t)) {
    return "Gdy serwer AI jest podłączony, odpowiadam na dowolne pytania po polsku. W trybie demo: godzina, pogoda na żywo i żarty. Pełna wersja głosowa wymaga aplikacji mobilnej z Device Access Toolkit.";
  }
  if (/(cześć|hej|dzień dobry|witaj)/.test(t)) return "Cześć! W czym mogę pomóc?";
  if (/(dziękuję|dzięki)/.test(t)) return "Nie ma za co!";
  return "Tryb demo (serwer AI niedostępny). Twoje pytanie: „" + q + "”.";
}

async function askBackend(q) {
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: q})
  });
  if (!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  if (!data.reply) throw new Error("pusta odpowiedź");
  return data.reply;
}

/* Najpierw próbujemy serwer AI (przekierowanie pytania),
   a jeśli jest niedostępny — wracamy do trybu demo. */
async function getAnswer(q) {
  if (BACKEND_URL) {
    try { return await askBackend(q); }
    catch (e) { /* serwer niedostępny — tryb demo */ }
  }
  const demo = localBrain(q);
  if (demo === "__WEATHER__") return liveWeather();
  return demo;
}

async function send(text) {
  const q = (text || "").trim();
  if (!q) return;
  addMsg(q, "user");
  inputEl.value = "";
  addMsg("…", "bot");
  const typing = messagesEl.lastChild;
  try {
    typing.textContent = await getAnswer(q);
  } catch (e) {
    typing.textContent = "Błąd połączenia z serwerem.";
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

document.getElementById("sendBtn").addEventListener("click", () => send(inputEl.value));
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(inputEl.value); });
document.querySelectorAll(".chip").forEach(ch =>
  ch.addEventListener("click", () => send(ch.dataset.q)));

/* --- Nawigacja D-pad: strzałki + Enter --- */
const focusables = Array.from(document.querySelectorAll(".focusable"));
let fi = 0;
function setFocus(i) {
  focusables.forEach(el => el.classList.remove("focused"));
  fi = (i + focusables.length) % focusables.length;
  focusables[fi].classList.add("focused");
  focusables[fi].focus({preventScroll: true});
}
document.addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"," "].includes(e.key)) e.preventDefault();
  if (e.key === "ArrowDown" || e.key === "ArrowRight") setFocus(fi + 1);
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") setFocus(fi - 1);
  else if (e.key === "Enter" || e.key === " ") focusables[fi].click();
});

/* Pytania wysłane z telefonu: okulary odpytują serwer co 3 sekundy */
async function pollPhone() {
  try {
    const res = await fetch("/api/pending");
    if (!res.ok) return;
    const data = await res.json();
    if (data && data.message) send(data.message);
  } catch (e) { /* brak połączenia — kolejna próba za 3 s */ }
}
setInterval(pollPhone, 3000);

/* Powitanie */
addMsg("Cześć! Jestem Asystent PL — prototyp polskiego asystenta na Twoje okulary. Wybierz szybkie pytanie, napisz własne albo wyślij je z telefonu.", "bot");
setFocus(0);
} // initGlassesMode
</script>
</body>
</html>
